name: CI
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build || true
      - run: npx @stoplight/spectral lint openapi-spec/ultimate-enterprise.yaml || true
      - run: bash scripts/make_package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: artifact.zip
